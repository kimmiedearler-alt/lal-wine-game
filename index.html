<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAL x WINE 💗</title>
<style>
body{margin:0;background:#ffe0f3;font-family:sans-serif;text-align:center;color:#57305e}
main{max-width:450px;margin:auto;padding:20px}
.card{background:white;border:4px solid #ff91ce;border-radius:20px;padding:20px;margin:15px 0}
h1{color:#fa3ca5;font-size:30px}
button{background:#ff4eae;color:white;border:0;border-radius:14px;padding:14px;margin:6px;width:100%;font-size:17px;font-weight:bold}
button:active{transform:scale(.97)}
#game{display:none}
#result{display:none}
.score{font-size:35px;color:#f32b9b;font-weight:bold}
</style>
</head>
<body>
<main>
<div class="card">
<h1>💗 แอบรักหัวหน้าสุดป่วน 💗</h1>
<p>LAL × WINE</p>
<p>หัวหน้าแผนกขาย × หัวหน้าแผนกบัญชี</p>
<div style="font-size:55px">👩🏻‍💼 💕 👩🏻‍💼</div>
<p>ภารกิจรักลับในบริษัท</p>
<div id="home">
<button onclick="start()">▶ เริ่มเกม</button>
<button onclick="alert('ทำภารกิจให้สำเร็จ 10 ด่าน ด่านละ 10 คะแนน! เลือกจังหวะที่ไม่มีใครเห็น แล้วเก็บคะแนนให้ครบ 100')">📖 วิธีเล่น</button>
</div>
</div>
<div id="game" class="card">
<h2 id="stage"></h2>
<p id="scene"></p>
<h3 id="question"></h3>
<div id="choices"></div>
<p id="feedback"></p>
</div>
<div id="result" class="card">
<h1>🎉 จบภารกิจ!</h1>
<div class="score" id="final"></div>
<p id="ending"></p>
<button onclick="share()">𝕏 แชร์คะแนน</button>
<button onclick="save()">📷 บันทึกรูปคะแนน</button>
<button onclick="location.reload()">เล่นอีกครั้ง</button>
</div>
</main>
<script>
const data=[
["ห้องประชุมเล็ก","ทุกคนกำลังก้มอ่านเอกสาร LAL นั่งข้าง WINE","จะแอบจับมือเมื่อไหร่?",["ตอนทุกคนก้มอ่านเอกสาร","ตอนทุกคนจ้องมาที่เรา"],0],
["ทางเดินบริษัท","ทั้งคู่เดินสวนกัน มีพนักงานอยู่ใกล้ ๆ","จะส่งสัญญาณรักยังไง?",["ตะโกนเรียกที่รัก","สบตาแล้วยิ้มบาง ๆ"],1],
["หน้าบริษัท","ถึงเวลาเลิกงาน พนักงานทยอยกลับบ้าน","เลือกจังหวะไหน?",["รอให้คนเดินผ่านไปก่อน","จับมือกลางฝูงชน"],0],
["ห้องฝ่ายขาย","LAL กำลังทำรายงาน WINE แวะมาส่งเอกสาร","จะจีบกันแบบไหน?",["ส่งโน้ตลับใต้แฟ้ม","เปิดเพลงรักเสียงดัง"],0],
["ห้องบัญชี","WINE อยู่คนเดียวชั่วครู่ LAL แวะคืนแฟ้ม","ทำอะไรดี?",["แอบส่งจุ๊บเร็ว ๆ","เรียกประชุมด่วน"],0],
["ห้องประชุม","ทุกคนกำลังมองกราฟบนจอ","จังหวะไหนปลอดภัย?",["ตอนทุกคนมองมาที่เรา","ตอนทุกคนสนใจกราฟ"],1],
["หน้าลิฟต์","ทั้งคู่รอลิฟต์ มีพนักงานอยู่ไม่ไกล","จะกระซิบตอนไหน?",["ตอนเสียงลิฟต์ดัง","ประกาศให้ทุกคนได้ยิน"],0],
["ร้านเหล้าญี่ปุ่น","ทั้งคู่นั่งกินอาหารหลังเลิกงาน","จะทำอะไรน่ารัก ๆ?",["เกี่ยวก้อยใต้เคาน์เตอร์","ปีนโต๊ะร้องเพลงรัก"],0],
["ลานโบว์ลิ่ง","WINE กำลังจะโยนบอล LAL อาสาสอน","จะใกล้ชิดกันยังไง?",["จับมือช่วยจัดท่าเมื่อเหมาะสม","ผลักอีกคนลงเลน"],0],
["ฉากพิเศษ","ทั้งคู่ยืนชมวิวเมืองหลังจบวัน","ภารกิจสุดท้ายคืออะไร?",["ขอบคุณกันแล้วจับมือ","ทำเป็นไม่รู้จักกัน"],0]
];
let n=0,score=0,done=false;
function start(){document.getElementById('home').style.display='none';document.getElementById('game').style.display='block';render()}
function render(){done=false;let d=data[n];document.getElementById('stage').textContent='ด่าน '+(n+1)+'/10 · คะแนน '+score+'/100';document.getElementById('scene').textContent=d[1];document.getElementById('question').textContent=d[2];document.getElementById('feedback').textContent='';let c=document.getElementById('choices');c.innerHTML='';d[3].forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(i);c.appendChild(b)})}
function answer(i){if(done)return;done=true;let d=data[n];let f=document.getElementById('feedback');if(i===d[4]){score+=10;f.textContent='สำเร็จ! +10 คะแนน 💗'}else{f.textContent='พลาดนิดเดียว รอบหน้าเอาใหม่นะ 💕'}document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);let b=document.createElement('button');b.textContent=n===9?'ดูผลคะแนน':'ด่านต่อไป →';b.onclick=()=>{n++;if(n===10)finish();else render()};document.getElementById('choices').appendChild(b);document.getElementById('stage').textContent='ด่าน '+(n+1)+'/10 · คะแนน '+score+'/100'}
function finish(){document.getElementById('game').style.display='none';document.getElementById('result').style.display='block';document.getElementById('final').textContent=score+'/100';document.getElementById('ending').textContent=score===100?'ความรักลับ ๆ สำเร็จสมบูรณ์! 💖':'ภารกิจจบแล้ว ลองอีกครั้งเพื่อเก็บคะแนนให้เต็ม!'}
function share(){let t='ฉันทำภารกิจ LAL × WINE ได้ '+score+'/100 คะแนน 💗 #LALxWINE';location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(t)}
function save(){let c=document.createElement('canvas');c.width=600;c.height=800;let x=c.getContext('2d');let g=x.createLinearGradient(0,0,600,800);g.addColorStop(0,'#ffb7e2');g.addColorStop(1,'#b7efff');x.fillStyle=g;x.fillRect(0,0,600,800);x.textAlign='center';x.fillStyle='#ed269b';x.font='bold 42px sans-serif';x.fillText('LAL × WINE',300,130);x.fillStyle='#56305e';x.font='30px sans-serif';x.fillText('แอบรักหัวหน้าสุดป่วน',300,205);x.fillStyle='#fff';x.fillRect(60,270,480,220);x.fillStyle='#f32b9b';x.font='bold 80px sans-serif';x.fillText(score+'/100',300,410);x.fillStyle='#56305e';x.font='25px sans-serif';x.fillText('คะแนนความรัก 💗',300,555);x.fillText('MISSION COMPLETE!',300,640);let a=document.createElement('a');a.download='lal-wine-score.png';a.href=c.toDataURL('image/png');a.click()}
</script>
</body>
  </html>
